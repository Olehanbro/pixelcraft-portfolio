    <text y="176" fill="#fff8ec" font-family="Georgia, serif" font-size="132" font-weight="700">Kursor</text>
    <text y="302" fill="#fff8ec" font-family="Georgia, serif" font-size="132" font-weight="700">Strategy</text>
