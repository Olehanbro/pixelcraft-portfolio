  </g>
  <path d="M92 856H1508" stroke="#f4c86a" stroke-opacity=".4"/>
  <text x="116" y="912" fill="#fff8ec" opacity=".58" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="10">LANDING BRAND RESPONSIVE</text>
