<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Kursor Strategy cover</title>
  <desc id="desc">Dark editorial strategy dashboard cover with gold and blue accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220832"/>
      <stop offset=".45" stop-color="#100514"/>
      <stop offset="1" stop-color="#351438"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".34" r=".52">
      <stop offset="0" stop-color="#2f7bff" stop-opacity=".56"/>
      <stop offset=".36" stop-color="#f4c86a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
