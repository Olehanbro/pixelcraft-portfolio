<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Mentora cover</title>
  <desc id="desc">Growth platform cover with warm cards and progress lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21082e"/>
      <stop offset=".46" stop-color="#14071c"/>
      <stop offset="1" stop-color="#40202e"/>
    </linearGradient>
    <radialGradient id="warm" cx=".72" cy=".34" r=".5">
      <stop offset="0" stop-color="#ffb86b" stop-opacity=".38"/>
      <stop offset=".42" stop-color="#f4c86a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>
  <g transform="translate(114 120)">
    <text fill="#f4c86a" font-family="Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="12">GROWTH-ПЛАТФОРМА</text>
    <text y="188" fill="#fff8ec" font-family="Georgia, serif" font-size="160" font-weight="700">Mentora</text>
    <text y="282" fill="#d8cbd6" font-family="Arial, sans-serif" font-size="34">Людяний сайт для росту і швидкої дії.</text>
  </g>
  <g transform="translate(794 166)">
    <rect width="620" height="482" rx="48" fill="#fff8ec" opacity=".07" stroke="#f4c86a" stroke-opacity=".42"/>
    <circle cx="156" cy="148" r="76" fill="#ffb86b" opacity=".8"/>
    <circle cx="372" cy="150" r="76" fill="#7a3cff" opacity=".44"/>
    <rect x="86" y="286" width="448" height="70" rx="35" fill="#fff8ec" opacity=".12"/>
    <rect x="86" y="286" width="276" height="70" rx="35" fill="#f4c86a" opacity=".62"/>
    <path d="M86 410H534" stroke="#fff8ec" stroke-opacity=".32" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M92 856H1508" stroke="#f4c86a" stroke-opacity=".4"/>
  <text x="116" y="912" fill="#fff8ec" opacity=".58" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="10">LANDING GROWTH RESPONSIVE</text>
</svg>
