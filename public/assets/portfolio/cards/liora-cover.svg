<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Liora cover</title>
  <desc id="desc">Fashion commerce cover with catalog grid cards.</desc>
  <defs>
