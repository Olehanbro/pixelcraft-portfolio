      <stop offset="0" stop-color="#2a0b37"/>
      <stop offset=".5" stop-color="#140519"/>
      <stop offset="1" stop-color="#3d183f"/>
    </linearGradient>
    <radialGradient id="rose" cx=".72" cy=".36" r=".52">
